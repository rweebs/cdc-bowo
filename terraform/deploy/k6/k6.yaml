# k6-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: k6
  labels:
    app: k6
spec:
  containers:
  - name: k6
    image: loadimpact/k6
    command: ["/bin/sleep", "3650d"]
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: app-config
      mountPath: /config
  volumes:
    - name: app-config
      configMap:
        name: app-config

