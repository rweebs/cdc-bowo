version: '3.7'

services:
  blue:
    image: hanzel/nginx-html:1
    ports:
      - 8111:80
    environment:
      - SERVICE_80_NAME=blue
    networks:
      - blue-green

  green:
    image: hanzel/nginx-html:2
    ports:
      - 8112:80
    environment:
      - SERVICE_80_NAME=green
    networks:
      - blue-green

networks:
  blue-green: